<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>UGREEN 备忘录 · 演示</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 30% 20%, #1b2745 0%, #0a1428 60%, #050b18 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  color: #fff;
  padding: 24px;
}
.gate {
  width: 100%;
  max-width: 380px;
  padding: 40px 36px 32px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 18px;
  box-shadow: 0 24px 72px rgba(0, 0, 0, 0.45);
}
.brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.brand-dot { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, #6ea8fe 0%, #4f6ef7 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.brand { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
.subtitle { font-size: 12.5px; color: rgba(255, 255, 255, 0.45); margin-bottom: 28px; padding-left: 38px; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.field label { font-size: 12px; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.02em; }
.field input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
  font-family: inherit;
}
.field input:focus {
  border-color: rgba(110, 168, 254, 0.6);
  background: rgba(255, 255, 255, 0.1);
}
.field input::placeholder { color: rgba(255, 255, 255, 0.28); }
.btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #6ea8fe 0%, #4f6ef7 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
  font-family: inherit;
}
.btn:hover { box-shadow: 0 6px 18px rgba(79, 110, 247, 0.35); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.err {
  font-size: 12.5px;
  color: #ff8080;
  margin-top: 10px;
  min-height: 16px;
  text-align: center;
}
.foot {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.25);
  margin-top: 28px;
  text-align: center;
  letter-spacing: 0.03em;
}
.loading-dot {
  display: inline-block;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #fff;
  margin: 0 2px;
  animation: blink 1.2s infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="off">
  <div class="brand-row">
    <div class="brand-dot">U</div>
    <div class="brand">UGREEN 备忘录</div>
  </div>
  <div class="subtitle">Web 端交互原型 · 私密预览</div>
  <div class="field">
    <label for="pw">访问密码</label>
    <input type="password" id="pw" placeholder="请输入密码" autofocus autocomplete="current-password">
  </div>
  <button type="submit" class="btn" id="enter">进入演示</button>
  <div class="err" id="err"></div>
  <div class="foot">© UGREEN Memo Demo · End-to-end encrypted</div>
</form>

function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
async function decrypt(password) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: b64ToBuf(PAYLOAD.salt),
      iterations: PAYLOAD.iter,
      hash: 'SHA-256',
    },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64ToBuf(PAYLOAD.iv) },
    key,
    b64ToBuf(PAYLOAD.ct)
  );
  return new TextDecoder().decode(pt);
}
const form = document.getElementById('gate');
const pwInput = document.getElementById('pw');
const btn = document.getElementById('enter');
const errEl = document.getElementById('err');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = pwInput.value;
  if (!pw) { errEl.textContent = '请输入密码'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
  errEl.textContent = '';
  try {
    const html = await decrypt(pw);
    // 用全屏 iframe + srcdoc 加载 demo —
    //   - iframe 是一个独立的文档环境，DOMContentLoaded / load 会正常触发
    //   - 比 document.write 更可靠（document.write 后 DCL 不再触发）
    //   - 比 Blob URL location.replace 更兼容（某些沙箱环境会拦截 blob: 导航）
    const iframe = document.createElement('iframe');
    iframe.setAttribute('id', 'demo-frame');
    iframe.setAttribute('srcdoc', html);
    iframe.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#fff;';
    // 替换 body 内容
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;padding:0;background:#fff;overflow:hidden;';
    document.body.appendChild(iframe);
  } catch (ex) {
    btn.disabled = false;
    btn.textContent = '进入演示';
    errEl.textContent = '密码错误，请重试';
    pwInput.select();
  }
});
</script>
